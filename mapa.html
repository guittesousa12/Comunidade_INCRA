<!DOCTYPE html>
<html lang="pt-br">
<head>
  <title>Mapa Comunitário</title>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <link rel="stylesheet" href="https://unpkg.com/leaflet.heat@0.2.0/dist/leaflet.heat.css"/>

  <style>
    #map { height: 100vh; }

    #filtros {
      position: absolute;
      top: 10px;
      left: 10px;
      z-index: 1000;
    }

    #filtroTipo {
      width: 220px;
      padding: 10px;
      border: 2px solid #00bf63;
      border-radius: 10px;
      background: white;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
    }

    #controles-buffer {
      position: absolute;
      top: 10px;
      right: 10px;
      background: white;
      padding: 10px;
      z-index: 1000;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.2);
      font-size: 12px;
    }

    #controles-buffer label {
      margin-right: 10px;
    }

    #logo {
      position: absolute;
      bottom: 10px;
      left: 10px;
      z-index: 1000;
    }

    #logo img {
      width: 15vw;
      max-width: 180px;
    }

    .loading {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(0,0,0,0.85);
      color: white;
      padding: 20px;
      border-radius: 8px;
      z-index: 2000;
      text-align: center;
    }

    .loading-logo {
      width: 80px;
      margin-bottom: 10px;
    }

    .buffer-circle {
      border-radius: 50%;
      pointer-events: none;
    }

    .leaflet-popup-content {
      font-size: 14px;
    }
  </style>
</head>

<body>

<div id="map"></div>

<div id="logo">
  <img src="assets/logo.png" alt="Logo">
</div>

<div id="filtros"></div>

<div id="controles-buffer">
  <label>
    <input type="checkbox" id="toggleBuffer" checked> Mostrar Buffer
  </label>
  <label>
    Raio: 
    <select id="raioBuffer">
      <option value="25">25m</option>
      <option value="50" selected>50m</option>
      <option value="100">100m</option>
      <option value="200">200m</option>
    </select>
  </label>
</div>

<div id="loading" class="loading">
  <img src="assets/logo.png" class="loading-logo">
  <p>Carregando dados...</p>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/papaparse@5.4.1/papaparse.min.js"></script>

<script>
// ================= CONFIG =================
const CONFIG = {
  sheetURL: "https://docs.google.com/spreadsheets/d/e/2PACX-1vS0QkPHFozeRjH9QtQh_OY-s-U5xGoqNcpCavJvUY9VHRIn02MUCAqw9GnVfddTn7Vt0Xs1yaqSbf1d/pub?output=csv",
  center: [-3.73, -38.52],
  zoom: 10
};

// ================= MAPA COM GOOGLE SATÉLITE =================
const map = L.map('map').setView(CONFIG.center, CONFIG.zoom);

L.tileLayer('https://{s}.google.com/vt/lyrs=y,m&x={x}&y={y}&z={z}', {
  subdomains: ['mt0', 'mt1', 'mt2', 'mt3'],
  attribution: 'Map data &copy; Google',
  maxZoom: 20,
  minZoom: 3
}).addTo(map);

// Carregar GeoJSON
fetch('assets/PA_Redonda.geojson')
  .then(response => response.json())
  .then(data => {
    const camadaGeojson = L.geoJSON(data, {
      style: {
        color: '#00bf63',
        weight: 3,
        fillColor: '#00bf63',
        fillOpacity: 0.2
      }
    }).addTo(map);
    map.fitBounds(camadaGeojson.getBounds());
  })
  .catch(error => {
    console.error('Erro GeoJSON:', error);
  });
  
// ================= FUNÇÃO COORDENADAS =================
function extrairCoordenadas(texto) {
  if (!texto) return null;

  const t = texto.toString().replace(/\s+/g, " ");

  const regex = /(-?\d{1,3}(?:\.\d+)?)[,\s]+(-?\d{1,3}(?:\.\d+)?)/g;

  let match;
  while ((match = regex.exec(t)) !== null) {
    let a = parseFloat(match[1]);
    let b = parseFloat(match[2]);

    if (a >= -90 && a <= 90 && b >= -180 && b <= 180) {
      return { lat: a, lon: b };
    }
    if (b >= -90 && b <= 90 && a >= -180 && a <= 180) {
      return { lat: b, lon: a };
    }
  }

  let g = t.match(/@(-?\d+\.\d+),(-?\d+\.\d+)/);
  if (g) return { lat: parseFloat(g[1]), lon: parseFloat(g[2]) };

  return null;
}

// ================= FUNÇÃO PARA CRIAR BUFFER =================
function criarBuffer(lat, lon, raioMetros, cor = 'rgba(0, 191, 99, 0.3)') {
  return L.circle([lat, lon], {
    radius: raioMetros,
    color: cor,
    fillColor: cor,
    fillOpacity: 0.5,
    weight: 0,
    className: 'buffer-circle'
  });
}

// ================= ESTADO =================
let state = {
  markers: [],
  buffers: [],
  tipoAtivo: null,
  tipos: new Set(),
  mostrarBuffer: true,
  raioBuffer: 50
};

// ================= ÍCONES DOS TIPOS =================
const simbolos = {
  1: "🌱",
  2: "🌾",
  3: "🌳",
  4: "💧",
  5: "🌽",
  6: "🕳️",
  7: "🥬",
  8: "🌿",
  9: "⚠️"
};

// Cores por tipo
const cores = {
  1: '#4CAF50',
  2: '#FFC107',
  3: '#8BC34A',
  4: '#2196F3',
  5: '#FF9800',
  6: '#795548',
  7: '#4CAF50',
  8: '#9E9E9E',
  9: '#F44336'
};

// Nomes dos tipos
const nomesTipos = {
  1: 'Feijão',
  2: 'Arroz',
  3: 'Cajueiro',
  4: 'Cisterna',
  5: 'Milho',
  6: 'Poço',
  7: 'Hortaliça',
  8: 'Em repouso',
  9: 'Degradado'
};

// ================= FILTROS =================
function aplicarFiltro(tipo) {
  state.tipoAtivo = tipo;

  state.markers.forEach(m => {
    if (tipo === null || m.tipo === tipo) {
      if (!map.hasLayer(m.layer)) {
        m.layer.addTo(map);
      }
    } else {
      if (map.hasLayer(m.layer)) {
        map.removeLayer(m.layer);
      }
    }
  });

  atualizarBuffers();
}

function criarFiltros() {
  const filtrosDiv = document.getElementById("filtros");
  
  let html = '<select id="filtroTipo">';
  html += '<option value="todos">🌎 Todos os pontos</option>';
  
  const tiposOrdenados = Array.from(state.tipos).sort((a, b) => a - b);
  
  tiposOrdenados.forEach(tipo => {
    const nome = nomesTipos[tipo] || `Tipo ${tipo}`;
    const simbolo = simbolos[tipo] || '📍';
    html += `<option value="${tipo}">${simbolo} ${nome}</option>`;
  });
  
  html += '</select>';
  filtrosDiv.innerHTML = html;

  document.getElementById("filtroTipo").addEventListener("change", function() {
    if (this.value === "todos") {
      aplicarFiltro(null);
    } else {
      aplicarFiltro(parseInt(this.value));
    }
  });
}

// ================= GERENCIAR BUFFERS =================
function atualizarBuffers() {
  state.buffers.forEach(buffer => {
    if (map.hasLayer(buffer)) {
      map.removeLayer(buffer);
    }
  });
  state.buffers = [];
  
  if (!state.mostrarBuffer) return;
  
  state.markers.forEach(marker => {
    if (state.tipoAtivo === null || marker.tipo === state.tipoAtivo) {
      const buffer = criarBuffer(
        marker.lat,
        marker.lon,
        state.raioBuffer,
        cores[marker.tipo] || 'rgba(0, 191, 99, 0.3)'
      );
      buffer.addTo(map);
      state.buffers.push(buffer);
    }
  });
}

// ================= CARREGAMENTO =================
function carregarDados() {
  const loading = document.getElementById("loading");
  loading.style.display = "block";

  state.markers.forEach(m => {
    if (map.hasLayer(m.layer)) {
      map.removeLayer(m.layer);
    }
  });
  state.buffers.forEach(b => {
    if (map.hasLayer(b)) {
      map.removeLayer(b);
    }
  });
  state.markers = [];
  state.buffers = [];
  state.tipos.clear();

  Papa.parse(CONFIG.sheetURL, {
    download: true,
    header: true,
    worker: true,
    skipEmptyLines: true,

    complete: function(res) {
      console.log('Dados carregados:', res.data.length, 'linhas');

      res.data.forEach((row) => {
        let lat = parseFloat(row.lat);
        let lon = parseFloat(row.lon || row.log || row.lng);
        let tipo = parseInt(row.tipo || row.Tipo);

        if (isNaN(lat) || isNaN(lon)) {
          const coordText = row.coordenadas || row.coordenada || row.localizacao || '';
          const coords = extrairCoordenadas(coordText);
          if (coords) {
            lat = coords.lat;
            lon = coords.lon;
          }
        }

        if (isNaN(lat) || isNaN(lon) || isNaN(tipo)) {
          return;
        }

        if (lat < -90 || lat > 90 || lon < -180 || lon > 180) {
          return;
        }

        state.tipos.add(tipo);

        const simbolo = simbolos[tipo] || '📍';
        const cor = cores[tipo] || '#000000';

        const marker = L.marker([lat, lon], {
          icon: L.divIcon({
            className: 'custom-marker',
            html: '<div style="font-size:24px;text-align:center;line-height:1;text-shadow:-1px -1px 0 white,1px -1px 0 white,-1px 1px 0 white,1px 1px 0 white,0 0 3px ' + cor + ';color:' + cor + ';">' + simbolo + '</div>',
            iconSize: [30, 30],
            iconAnchor: [15, 15],
            popupAnchor: [0, -15]
          })
        }).bindPopup(
          '<div style="min-width:150px;font-family:Arial,sans-serif;">' +
          '<div style="font-size:28px;text-align:center;margin-bottom:5px;">' + simbolo + '</div>' +
          '<b>Tipo:</b> ' + (nomesTipos[tipo] || tipo) + '<br>' +
          '<b>Localização:</b><br>' +
          lat.toFixed(5) + ', ' + lon.toFixed(5) +
          (row.nome ? '<br><b>Nome:</b> ' + row.nome : '') +
          (row.descricao ? '<br><b>Descrição:</b> ' + row.descricao.substring(0,100) : '') +
          (row.observacao ? '<br><b>Obs:</b> ' + row.observacao.substring(0,100) : '') +
          '</div>'
        );

        marker.addTo(map);

        state.markers.push({
          layer: marker,
          tipo: tipo,
          lat: lat,
          lon: lon,
          dados: row
        });
      });

      console.log('Marcadores criados:', state.markers.length);

      criarFiltros();
      atualizarBuffers();

      if (state.markers.length > 0) {
        const bounds = L.latLngBounds(state.markers.map(m => [m.lat, m.lon]));
        map.fitBounds(bounds, { padding: [50, 50] });
      }

      loading.style.display = "none";
    },
    error: function(error) {
      console.error('Erro ao carregar dados:', error);
      loading.innerHTML = 
        '<img src="assets/logo.png" class="loading-logo">' +
        '<p>Erro ao carregar dados.</p>' +
        '<p style="font-size:12px;color:#aaa;">' + error.message + '</p>' +
        '<button onclick="carregarDados()" style="margin-top:10px;padding:5px 15px;cursor:pointer;">Tentar novamente</button>';
    }
  });
}

// ================= CONTROLES DE BUFFER =================
function setupBufferControls() {
  const toggle = document.getElementById('toggleBuffer');
  const raioSelect = document.getElementById('raioBuffer');
  
  toggle.addEventListener('change', function(e) {
    state.mostrarBuffer = e.target.checked;
    atualizarBuffers();
  });
  
  raioSelect.addEventListener('change', function(e) {
    state.raioBuffer = parseInt(e.target.value);
    atualizarBuffers();
  });
}

// ================= INICIALIZAÇÃO =================
setupBufferControls();
carregarDados();

setInterval(carregarDados, 300000);
</script>

</body>
</html>
