<!DOCTYPE html>

<html lang="pt-BR">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Portal Comunitário</title>

<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{

    width:100%;
    height:100vh;

    background:url("assets/fundo.jpg") center center/cover no-repeat;

    display:flex;
    justify-content:center;
    align-items:center;

    font-family:Arial,sans-serif;
}

.container{

    text-align:center;
}

h1{

    color:#00bf63;

    font-family:'DM Serif Display', serif;

    font-size:4rem;

    margin-bottom:40px;

    text-shadow:2px 2px 10px rgba(255,255,255,.8);
}

.menu-opcoes{

    display:flex;

    gap:25px;

    justify-content:center;

    flex-wrap:wrap;
}

.card-menu{

    width:280px;
    height:180px;

    border:none;

    border-radius:20px;

    background:#00bf63;

    color:white;

    font-family:'DM Serif Display', serif;

    font-size:1.4rem;

    cursor:pointer;

    transition:.3s;

    box-shadow:0 6px 15px rgba(0,0,0,.25);
}

.card-menu:hover{

    transform:translateY(-8px);

    box-shadow:0 12px 25px rgba(0,0,0,.35);
}

</style>

</head>

<body>

<div class="container">

```
<h1>Menu Principal</h1>

<div class="menu-opcoes">

    <button class="card-menu"
            onclick="window.location.href='folhetim.html'">

        📖<br><br>
        Folhetins das Comunidades

    </button>

    <button class="card-menu"
            onclick="window.location.href='mapa.html'">

        🗺️<br><br>
        Adicione Dados

    </button>

</div>
```

</div>

</body>

</html>
